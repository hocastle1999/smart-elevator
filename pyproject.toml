[project]
name = "smart-elevator"
version = "0.1.0"
description = "엘리베이터 배차 알고리즘 시뮬레이터와 운행 모니터링"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
