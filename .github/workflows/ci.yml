name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # 운행 기록과 SQL 통계 테스트는 실제 MySQL 8.0에서 돈다 (윈도 함수, 생성 열, CHECK 제약).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smart_elevator_test
          MYSQL_USER: smart_elevator_app
          MYSQL_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # CI 전용 값. 실제 비밀 값과는 무관하다.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: smart_elevator_app
      DB_PASSWORD: ci-password
      TEST_DB_NAME: smart_elevator_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest -q

      # 배포와 같은 시작 명령으로 서버를 띄워, 실제로 요청을 받는지 확인한다 (DB 없이).
      - name: Smoke test (server starts)
        run: |
          uvicorn app.main:app --port 8000 --no-proxy-headers &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/api/state > /dev/null
          curl -fsS http://127.0.0.1:8000/ | grep -q "Smart Elevator"
